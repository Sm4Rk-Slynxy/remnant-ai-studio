# Rendered by install.sh. Only the configured browser origin may make cross-origin requests.
map $http_origin $studio_origin_allowed {
    default 0;
    "" 1;
    "{FRONTEND_ORIGIN}" 1;
}
map $http_origin $studio_backend_origin {
    default "";
    "{FRONTEND_ORIGIN}" "http://127.0.0.1:8099";
}
server {
    listen {PORT};
    listen [::]:{PORT};
    server_name _;
    client_max_body_size 500m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    if ($studio_origin_allowed = 0) { return 403; }
    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8099;
        proxy_set_header Origin $studio_backend_origin;
        proxy_set_header Connection "";
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_buffering off;
    }
}
